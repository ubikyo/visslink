# VissLink v0.3 — Viessmann Vitotronic 300 KW3 via Optolink
# Matériel : Wemos D1 mini (ESP8266) + interface infrarouge Optolink.
#
# Les identifiants sont lus dans secrets.yaml (non versionné), voir
# secrets.yaml.example.
#
# Registres actifs : ceux dont l'adresse et le type sont établis. Les registres
# expérimentaux sont en commentaire en fin de fichier, avec la marche à suivre
# pour les vérifier avant de les activer.
#
# Écritures : DÉSACTIVÉES (enable_writes: false). Les consignes sont exposées
# en `number` mais restent en lecture seule : une modification depuis Home
# Assistant est refusée, journalisée, et l'entité revient à la valeur lue.
# Les écritures KW ne sont pas encore validées sur cette chaudière : lire
# docs/ecriture-kw.md avant toute activation.
#
# Charge : ~7 lectures/min ici, ~13 avec les registres expérimentaux. Une
# lecture prend ~2 à 3 s (attente du 0x05), soit 20 à 30 lectures/min au plus :
# garder une marge en ajoutant des registres. Les programmations horaires
# ajoutent 28 lectures toutes les 6 h, étalées sur ~4 min (une lecture par
# circuit toutes les ~30 s).

esphome:
  name: iot-viessmann
  friendly_name: Chaudière Viessmann

esp8266:
  board: d1_mini

external_components:
  # Dépôt local (développement). Pour utiliser la version publiée :
  #   - source: github://ubikyo/visslink
  #     components: [visslink]
  - source:
      type: local
      path: ../components
    components: [visslink]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "iot-viessmann Fallback"
    password: !secret fallback_ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # Chiffrement OTA avec la clé de l'API (recommandé par ESPHome 2026.10).
    encryption: {}

# L'UART matériel (GPIO1/GPIO3) est réservé à l'Optolink :
# les journaux passent uniquement par l'API / le réseau.
logger:
  level: DEBUG
  baud_rate: 0

uart:
  id: optolink_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 2

# Heure locale fournie par Home Assistant : jour courant et plage active des
# programmations horaires. Sans synchronisation, ces états restent inconnus.
time:
  - platform: homeassistant
    id: ha_time

visslink:
  id: viessmann
  uart_id: optolink_uart
  # Valeurs par défaut, affichées pour référence :
  sync_timeout: 10s       # attente maximale du caractère de synchro 0x05
  response_timeout: 1s    # attente maximale de la réponse après la requête
  max_retries: 2          # nouvelles tentatives avant d'abandonner le cycle
  # Écritures Optolink (consignes de la liste blanche uniquement). Laisser à
  # false tant que la procédure de docs/ecriture-kw.md n'est pas terminée.
  enable_writes: false
  # Programmes de fonctionnement (expérimental, 0x2301 seulement). Exige
  # aussi enable_writes. Laisser à false avant l'essai de docs/ecriture-kw.md.
  enable_mode_writes: false

sensor:
  # --- Températures (int16, dixièmes de degré) ------------------------------
  # Le type int16 est le défaut (comportement v0.1) ; il est écrit ici pour
  # la lisibilité.
  - platform: visslink
    name: "Température extérieure"
    address: 0x0800
    data_type: int16
    update_interval: 60s
    unit_of_measurement: "°C"
    device_class: temperature
    filters:
      - multiply: 0.1

  - platform: visslink
    name: "Température chaudière"
    address: 0x0802
    data_type: int16
    update_interval: 60s
    unit_of_measurement: "°C"
    device_class: temperature
    filters:
      - multiply: 0.1

  - platform: visslink
    name: "Température ECS"
    address: 0x0804
    data_type: int16
    update_interval: 60s
    unit_of_measurement: "°C"
    device_class: temperature
    filters:
      - multiply: 0.1

  - platform: visslink
    name: "Température départ M2"
    address: 0x3900
    data_type: int16
    update_interval: 60s
    unit_of_measurement: "°C"
    device_class: temperature
    filters:
      - multiply: 0.1

  # --- Consignes : voir `number:` ci-dessous (v0.3) -------------------------

  # --- Brûleur (compteurs uint32) -------------------------------------------
  - platform: visslink
    name: "Démarrages brûleur"
    address: 0x088A
    data_type: uint32
    update_interval: 1h
    state_class: total_increasing
    accuracy_decimals: 0

  - platform: visslink
    name: "Heures de fonctionnement brûleur"
    address: 0x08A7
    data_type: uint32          # secondes
    update_interval: 1h
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.00027777778  # s -> h

  # --- Expérimental : à vérifier avant activation ---------------------------
  # Consigne chaudière calculée. Adresse non confirmée sur cette installation :
  # comparer la valeur à celle affichée par la régulation.
  # - platform: visslink
  #   name: "Consigne chaudière calculée"
  #   address: 0x5502
  #   data_type: int16
  #   update_interval: 60s
  #   unit_of_measurement: "°C"
  #   device_class: temperature
  #   filters:
  #     - multiply: 0.1

  # Vérification d'un état binaire (étape 1) : lire d'abord l'octet brut en
  # uint8 et observer ses valeurs pendant quelques jours (journaux DEBUG :
  # "0x0846 <- 01"). Ne passer en binary_sensor (étape 2) que si seules les
  # valeurs 0 et 1 apparaissent et qu'elles suivent le fonctionnement réel.
  # Une même adresse ne peut être déclarée qu'une fois : retirer l'entrée
  # uint8 en activant le binary_sensor correspondant.
  # - platform: visslink
  #   name: "Brut 0x0846 pompe de bouclage ECS"
  #   address: 0x0846
  #   data_type: uint8
  #   update_interval: 60s
  #   accuracy_decimals: 0
  #   state_class: measurement

binary_sensor:
  # 0x00 = arrêt, 0x01 = marche. Toute autre valeur : état inconnu + avertissement
  # dans les journaux (aucune interprétation arbitraire).
  - platform: visslink
    name: "Brûleur actif"
    address: 0x0842
    update_interval: 30s
    device_class: running

  # --- Expérimental : à vérifier avant activation (voir étape 1 ci-dessus) --
  # Fortement corroboré, à valider sur cette chaudière.
  # - platform: visslink
  #   name: "Pompe de bouclage ECS"
  #   address: 0x0846
  #   update_interval: 60s
  #   device_class: running

  # À confirmer.
  # - platform: visslink
  #   name: "Pompe de charge ECS"
  #   address: 0x0845
  #   update_interval: 60s
  #   device_class: running

  # À confirmer.
  # - platform: visslink
  #   name: "Défaut chaudière"
  #   address: 0x0883
  #   update_interval: 60s
  #   device_class: problem

  # À confirmer.
  # - platform: visslink
  #   name: "Circulateur A1"
  #   address: 0x2906
  #   update_interval: 60s
  #   device_class: running

  # À confirmer.
  # - platform: visslink
  #   name: "Circulateur M2"
  #   address: 0x3906
  #   update_interval: 60s
  #   device_class: running

# --- Consignes (v0.3) -----------------------------------------------------------
# uint8, degrés entiers. L'état affiché est toujours la valeur LUE dans la
# régulation (toutes les 5 min, et juste après une écriture). Adresses de la
# liste blanche uniquement ; min/max obligatoires, compris dans la plage
# documentée (3..37 °C ambiance, 10..60 °C ECS) : les valeurs ci-dessous sont
# des exemples à adapter à l'installation.
number:
  - platform: visslink
    visslink_id: viessmann
    name: "Radiateurs - Consigne confort"
    address: 0x2306
    min_value: 16
    max_value: 24
    step: 1
    unit_of_measurement: "°C"
    mode: box

  - platform: visslink
    visslink_id: viessmann
    name: "Radiateurs - Consigne réduite"
    address: 0x2307
    min_value: 10
    max_value: 20
    step: 1
    unit_of_measurement: "°C"
    mode: box

  - platform: visslink
    visslink_id: viessmann
    name: "Plancher - Consigne confort"
    address: 0x3306
    min_value: 16
    max_value: 24
    step: 1
    unit_of_measurement: "°C"
    mode: box

  - platform: visslink
    visslink_id: viessmann
    name: "Plancher - Consigne réduite"
    address: 0x3307
    min_value: 10
    max_value: 20
    step: 1
    unit_of_measurement: "°C"
    mode: box

  - platform: visslink
    visslink_id: viessmann
    name: "ECS - Consigne"
    address: 0x6300
    min_value: 40
    max_value: 60
    step: 1
    unit_of_measurement: "°C"
    mode: box

# --- Modes de fonctionnement (v0.3, expérimental) ------------------------------
# Affichés en texte. Valeurs validées sur cette KW3 : 00 = ECS seule,
# 03 = Chauffage + ECS, 05 = Arrêt ; toute autre valeur : inconnu.
# A1 (0x2301) : sélecteur, seul registre dont l'écriture est documentée ;
# modifiable seulement si enable_writes ET enable_mode_writes. Son état est
# toujours la dernière valeur RELUE, jamais une commande en attente.
# M2 (0x3301) : lecture seule stricte, en text_sensor (voir plus bas).
select:
  - platform: visslink
    visslink_id: viessmann
    name: "Radiateurs - Mode actuel"
    address: 0x2301
    update_interval: 5min

# --- Programmations horaires (lecture seule) ---------------------------------
# `address` est celle du lundi ; les 7 jours sont lus à address + 8 × jour.
# État principal : la semaine, jours identiques regroupés
#   "Lu-Ve 06:00-22:00 | Sa-Di 07:00-23:00"
# `today` : programmation du jour. `active` : une plage programmée est en cours
# (n'indique PAS que le brûleur ou une pompe fonctionne réellement).
# Option : `monday:` ... `sunday:` (un capteur texte par jour, cf. README).
text_sensor:
  - platform: visslink
    name: "Radiateurs - Programmation"
    address: 0x2000
    update_interval: 6h
    time_id: ha_time
    today:
      name: "Radiateurs - Programmation du jour"
    active:
      name: "Radiateurs - Plage active"

  - platform: visslink
    name: "Plancher - Programmation"
    address: 0x3000
    update_interval: 6h
    time_id: ha_time
    today:
      name: "Plancher - Programmation du jour"
    active:
      name: "Plancher - Plage active"

  - platform: visslink
    name: "ECS - Programmation"
    address: 0x2100
    update_interval: 6h
    time_id: ha_time
    today:
      name: "ECS - Programmation du jour"
    active:
      name: "ECS - Plage active"

  - platform: visslink
    name: "Bouclage ECS - Programmation"
    address: 0x2200
    update_interval: 6h
    time_id: ha_time
    today:
      name: "Bouclage ECS - Programmation du jour"
    active:
      name: "Bouclage ECS - Plage active"

  # Mode de M2, en lecture seule stricte : aucune commande possible depuis
  # Home Assistant. « Inconnu » pour une valeur hors 00/03/05 ou un échec de
  # lecture. `divergence` : A1 et M2 dans des modes différents (affiché,
  # jamais corrigé automatiquement).
  - platform: visslink
    visslink_id: viessmann
    type: operating_mode
    name: "Plancher chauffant - Mode actuel"
    address: 0x3301
    update_interval: 5min
    divergence:
      name: "Modes A1 et M2 différents"
