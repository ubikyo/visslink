name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
          pip install esphome==2026.10.2 pytest ruff
      - name: Lint
        run: make lint
      - name: Unit tests and config validation
        run: pytest -v
      - name: Compile firmware (d1_mini)
        # `make compile` génère des secrets fictifs, uniquement pour la compilation.
        run: make compile
      - name: Validate and compile v0.1 YAML (backward compatibility)
        # YAML de la v0.1.0 inchangé (tests/fixtures), sans binary_sensor.
        run: make compat-v01
