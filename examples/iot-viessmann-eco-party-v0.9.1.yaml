# VissLink v0.9.1 — PILOTAGE ÉCO / PARTY (EXPÉRIMENTAL, ÉTAPE 1)
# Base : examples/iot-viessmann-eco-party-v0.9.yaml, inchangé par ailleurs.
#
# Lecture des six registres validée sur la Vitotronic 300 KW3 (209C) :
# 0x2302 / 0x3302 Éco A1 / M2 (0/1), 0x2303 / 0x3303 Party A1 / M2 (0/1),
# 0x2308 / 0x3308 consignes Party A1 / M2 (°C entiers).
#
# Changements par rapport à la v0.9 :
#   - les quatre états Éco/Party passent de `binary_sensor` à `switch`
#     (entités Home Assistant nouvelles : switch.* au lieu de binary_sensor.*) ;
#   - les deux consignes Party passent de `sensor` à `number` ;
#   - chaque entité a son `status` (texte d'état des commandes).
#
# ÉCRITURE NON VALIDÉE sur cette KW3 (documentée seulement pour la 200 KW2,
# et nulle part pour Éco M2). Validation registre par registre, dans l'ordre
# de docs/eco-party-v0.9.1.md § 3 ; `allow_write: false` garde une entité en
# lecture seule. ÉTAPE 1 (ce fichier) : seule la consigne Party A1 (0x2308)
# est inscriptible. Étape suivante : passer `allow_write` à true sur la
# ligne suivante de la procédure, une seule à la fois.
#
# Chaque commande : relecture préalable, écriture d'un octet, relecture du
# registre (et, pour Éco/Party, de l'autre commande du même circuit), texte
# d'état « Confirmé / Échec / Indéterminé ». Aucune commande au démarrage,
# jamais de nouvel essai. Les consignes confort/réduite ne sont jamais
# modifiées pour simuler Éco ou Party ; le climate M2 garde HEAT/OFF, sans
# preset. Les changements faits à la Vitotronic ou à la Vitotrol (et les fins
# automatiques) sont relus : 60 s pour Éco/Party, 5 min pour les consignes.
#
# Rappel v0.9 : analyse des sources dans docs/eco-party-v0.9.md.
#
# Rappel v0.8.1 (base : examples/iot-viessmann-programmations-v0.8.yaml) :
#
# Rappel v0.8 (base : examples/iot-viessmann-ecritures-autorisees.yaml) :
#   - `visslink_schedule_editor` : consulter et modifier depuis Home
#     Assistant les programmations A1 (0x2000), M2 (0x3000), ECS (0x2100) et
#     bouclage ECS (0x2200) ; une seule entité d'état ;
#   - six actions Home Assistant (api: actions:) utilisées par la carte
#     Lovelace lovelace/visslink-schedule-card.js (docs/programmations-v0.8.md) ;
#   - un `id` sur chacune des quatre programmations (aucune lecture en plus).
#
# Toujours vrai :
#   - la Vitotronic reste l'unique source de vérité : rien n'est gardé dans
#     Home Assistant, l'éditeur part des 8 octets lus ;
#   - un jour = un bloc de 8 octets : lecture, comparaison avec le bloc
#     affiché (une modification faite au panneau n'est jamais écrasée),
#     sauvegarde en flash, écriture, relecture exacte ; « Enregistré »
#     seulement après cette relecture ; jamais les sept jours pour un seul ;
#   - verrou mutuel avec le bouclage temporaire, restauration comprise ;
#   - plages : pas de 10 min, 4 par jour, fin au plus tard 23:50, sans
#     chevauchement (plages contiguës admises).
#
# v0.8.1 (diagnostics) :
#   - `visslink_burner` : cycles du brûleur (démarrages sur 24 h et par heure,
#     durée moyenne : EXACTS, d'après les compteurs ; dernier cycle, dernier
#     arrêt, températures au démarrage et à l'arrêt : ESTIMÉS, d'après la
#     lecture du brûleur toutes les 30 s). Aucune lecture Optolink en plus :
#     réutilise 0x0842, 0x088A, 0x08A7 et 0x0802 (docs/cycles-bruleur-v0.8.1.md) ;
#   - consigne chaudière calculée (0x5502), réseau et uptime en diagnostic ;
#   - « État modification » des consignes : « Aucune modification effectuée »
#     au démarrage au lieu de « Inconnu ».
#
# Risques acceptés en flashant ce fichier : écriture des blocs A1, M2 et ECS
# jamais essayée sur cette chaudière ; premiers essais un circuit et un jour
# à la fois, contrôlés au panneau (docs/programmations-v0.8.md, § 8).
#
# Les identifiants sont lus dans secrets.yaml (non versionné), voir
# secrets.yaml.example.
#
# Même nom de nœud que la production : flasher ce fichier REMPLACE le firmware
# en place.

esphome:
  name: iot-viessmann
  friendly_name: Chaudière Viessmann

esp8266:
  board: d1_mini

external_components:
  # Dépôt local (développement). Pour utiliser la version publiée :
  #   - source: github://ubikyo/visslink
  #     components: [visslink, visslink_boost, visslink_schedule_editor, visslink_burner]
  - source:
      type: local
      path: ../components
    components: [visslink, visslink_boost, visslink_schedule_editor, visslink_burner]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "iot-viessmann Fallback"
    password: !secret fallback_ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  # v0.8 : actions de l'éditeur des programmations (carte Lovelace, scripts).
  # Dans Home Assistant : esphome.iot_viessmann_visslink_schedule_read, etc.
  # circuit : a1, m2, ecs ou bouclage ; days : "0,1,2" (0 = lundi ...
  # 6 = dimanche) ou "*" (les sept) ; ranges : "06:00-08:30,17:00-22:00" ("" = aucune plage) ;
  # expected : champ `expected` renvoyé par visslink_schedule_read (bloc
  # affiché), ou "" pour la dernière lecture de l'ESP.
  actions:
    - action: visslink_schedule_read
      variables:
        circuit: string
      then:
        - api.respond:
            data: !lambda "id(programmations).read(circuit, root);"
    - action: visslink_schedule_set
      variables:
        circuit: string
        days: string
        ranges: string
        expected: string
      then:
        - api.respond:
            success: !lambda "return id(programmations).set_days(circuit, days, ranges, expected);"
            error_message: !lambda "return id(programmations).last_error();"
    - action: visslink_schedule_copy
      variables:
        circuit: string
        source: int
        days: string
        expected: string
      then:
        - api.respond:
            success: !lambda "return id(programmations).copy_day(circuit, source, days, expected);"
            error_message: !lambda "return id(programmations).last_error();"
    - action: visslink_schedule_clear
      variables:
        circuit: string
        days: string
        expected: string
      then:
        - api.respond:
            success: !lambda "return id(programmations).clear_days(circuit, days, expected);"
            error_message: !lambda "return id(programmations).last_error();"
    - action: visslink_schedule_refresh
      variables:
        circuit: string
      then:
        - api.respond:
            success: !lambda "return id(programmations).refresh(circuit);"
            error_message: !lambda "return id(programmations).last_error();"
    - action: visslink_schedule_undo
      then:
        - api.respond:
            success: !lambda "return id(programmations).undo();"
            error_message: !lambda "return id(programmations).last_error();"

ota:
  - platform: esphome
    # Chiffrement OTA avec la clé de l'API (recommandé par ESPHome 2026.10).
    encryption: {}

# L'UART matériel (GPIO1/GPIO3) est réservé à l'Optolink :
# les journaux passent uniquement par l'API / le réseau.
logger:
  level: DEBUG
  baud_rate: 0

uart:
  id: optolink_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 2

# Heure locale fournie par Home Assistant : jour courant et plage active des
# programmations horaires. Sans synchronisation, ces états restent inconnus.
time:
  - platform: homeassistant
    id: ha_time

visslink:
  id: viessmann
  uart_id: optolink_uart
  # Valeurs par défaut, affichées pour référence :
  sync_timeout: 10s       # attente maximale du caractère de synchro 0x05
  response_timeout: 1s    # attente maximale de la réponse après la requête
  max_retries: 2          # nouvelles tentatives avant d'abandonner le cycle
  # Écritures : autorisées par défaut, sans déclaration, dans les limites des
  # protections internes (listes blanches, contrôle des valeurs, relecture
  # après chaque écriture, restauration du bouclage). Pour désactiver :
  # enable_writes: false (tout), ou l'autorisation concernée à false
  # (docs/ecriture-kw.md).

sensor:
  # --- Températures (int16, dixièmes de degré) ------------------------------
  # Le type int16 est le défaut (comportement v0.1) ; il est écrit ici pour
  # la lisibilité.
  - platform: visslink
    name: "Température extérieure"
    address: 0x0800
    data_type: int16
    update_interval: 60s
    unit_of_measurement: "°C"
    device_class: temperature
    filters:
      - multiply: 0.1

  - platform: visslink
    id: temperature_chaudiere
    name: "Température chaudière"
    address: 0x0802
    data_type: int16
    update_interval: 60s
    unit_of_measurement: "°C"
    device_class: temperature
    filters:
      - multiply: 0.1

  - platform: visslink
    name: "Température ECS"
    address: 0x0804
    data_type: int16
    update_interval: 60s
    unit_of_measurement: "°C"
    device_class: temperature
    filters:
      - multiply: 0.1

  - platform: visslink
    name: "Température départ M2"
    address: 0x3900
    data_type: int16
    update_interval: 60s
    unit_of_measurement: "°C"
    device_class: temperature
    filters:
      - multiply: 0.1

  # --- Consignes : voir `number:` ci-dessous (v0.3) -------------------------

  # --- v0.7 : ambiance mesurée par la Vitotrol 200 du plancher -------------
  # Observée cohérente avec la température intérieure de la Vitotrol, pas
  # encore validée (suivi dans la durée, codage int16 0,1 °C supposé). Seule source d'ambiance du climate M2 ; la
  # température de départ (0x3900) n'en est jamais une.
  - platform: visslink
    visslink_id: viessmann
    id: m2_room_temperature
    name: "Plancher chauffant - Température ambiante (Vitotrol)"
    address: 0x0898
    data_type: int16
    invalid_values: [0xFFFF]
    update_interval: 60s
    unit_of_measurement: "°C"
    device_class: temperature
    filters:
      - multiply: 0.1

  # --- Brûleur (compteurs uint32) -------------------------------------------
  - platform: visslink
    id: demarrages_bruleur
    name: "Démarrages brûleur"
    address: 0x088A
    data_type: uint32
    update_interval: 1h
    state_class: total_increasing
    accuracy_decimals: 0

  - platform: visslink
    id: fonctionnement_bruleur
    name: "Heures de fonctionnement brûleur"
    address: 0x08A7
    data_type: uint32          # secondes
    update_interval: 1h
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.00027777778  # s -> h

  # --- v0.8.1 : diagnostics de fonctionnement -------------------------------
  # Consigne chaudière calculée (int16, 0,1 °C ; journal « 0x5502 <- 4A 02 »
  # = 58,6 °C). Lecture seule, toutes les 2 min (docs/registres.md § 3.5).
  - platform: visslink
    name: "Consigne chaudière calculée"
    address: 0x5502
    data_type: int16
    update_interval: 2min
    unit_of_measurement: "°C"
    device_class: temperature
    entity_category: diagnostic
    filters:
      - multiply: 0.1

  # Réseau et uptime de l'ESP (aucune lecture Optolink).
  - platform: wifi_signal
    name: "VissLink - Signal Wi-Fi"
    update_interval: 60s
  - platform: uptime
    name: "VissLink - Uptime"

  # --- Expérimental : à vérifier avant activation ---------------------------

  # Consignes de départ A1 / M2 (v0.5.1). Adresses NON confirmées sur la KW3 :
  # lues FF FF sur cette installation (affiché -0,1 °C sans traitement).
  # `invalid_values` publie FF FF comme « inconnu » ; ne l'utiliser que sur
  # un registre où FF FF n'est pas une valeur réelle (cf. registres.md § 7).
  # - platform: visslink
  #   name: "Radiateurs - Consigne départ"
  #   address: 0x2544
  #   data_type: int16
  #   invalid_values: [0xFFFF]
  #   update_interval: 5min
  #   unit_of_measurement: "°C"
  #   device_class: temperature
  #   filters:
  #     - multiply: 0.1
  # - platform: visslink
  #   name: "Plancher chauffant - Consigne départ"
  #   address: 0x3544
  #   data_type: int16
  #   invalid_values: [0xFFFF]
  #   update_interval: 5min
  #   unit_of_measurement: "°C"
  #   device_class: temperature
  #   filters:
  #     - multiply: 0.1

  # Vérification d'un état binaire (étape 1) : lire d'abord l'octet brut en
  # uint8 et observer ses valeurs pendant quelques jours (journaux DEBUG :
  # "0x0846 <- 01"). Ne passer en binary_sensor (étape 2) que si seules les
  # valeurs 0 et 1 apparaissent et qu'elles suivent le fonctionnement réel.
  # Une même adresse ne peut être déclarée qu'une fois : retirer l'entrée
  # uint8 en activant le binary_sensor correspondant.
  # - platform: visslink
  #   name: "Brut 0x0846 pompe de bouclage ECS"
  #   address: 0x0846
  #   data_type: uint8
  #   update_interval: 60s
  #   accuracy_decimals: 0
  #   state_class: measurement

binary_sensor:
  # 0x00 = arrêt, 0x01 = marche. Toute autre valeur : état inconnu + avertissement
  # dans les journaux (aucune interprétation arbitraire).
  - platform: visslink
    id: bruleur_actif
    name: "Brûleur actif"
    address: 0x0842
    update_interval: 30s
    device_class: running

  # --- Bouclage ECS : état RÉEL du circulateur (lecture seule) -------------
  # Sortie de la régulation : 00 -> 01 -> 00 observé le 15/11. Une plage
  # inscrite ne garantit pas que la pompe tourne (la régulation décide).
  # Toute autre valeur : état inconnu + avertissement. Jamais écrit.
  - platform: visslink
    name: "Bouclage ECS — Pompe (état réel, 0x0846)"
    address: 0x0846
    update_interval: 15s
    device_class: running

  # À confirmer.
  # - platform: visslink
  #   name: "Pompe de charge ECS"
  #   address: 0x0845
  #   update_interval: 60s
  #   device_class: running

  # À confirmer.
  # - platform: visslink
  #   name: "Défaut chaudière"
  #   address: 0x0883
  #   update_interval: 60s
  #   device_class: problem

  # À confirmer.
  # - platform: visslink
  #   name: "Circulateur A1"
  #   address: 0x2906
  #   update_interval: 60s
  #   device_class: running

  # v0.7 : circulateur M2 (état remonté, pas encore validé : seules 00/01
  # attendues ; toute autre valeur rend l'état inconnu). Action du climate,
  # affichage seulement : jamais écrit, jamais utilisé comme commande.
  - platform: visslink
    visslink_id: viessmann
    id: m2_pump
    name: "Plancher chauffant - Circulateur"
    address: 0x3906
    update_interval: 60s
    device_class: running

# --- Consignes (v0.3) -----------------------------------------------------------
# uint8, degrés entiers. L'état affiché est toujours la valeur LUE dans la
# régulation (toutes les 5 min, et juste après une écriture). Adresses de la
# liste blanche uniquement ; min/max obligatoires, compris dans la plage
# documentée (3..37 °C ambiance, 10..60 °C ECS) : les valeurs ci-dessous sont
# des exemples à adapter à l'installation.
switch:
  # --- v0.9.1 : commandes Éco et Party (EXPÉRIMENTAL) -----------------------
  # 1 octet, 00 = inactif, 01 = actif (lecture validée sur cette KW3). L'état
  # affiché est toujours l'état LU (60 s, et juste après chaque commande).
  # Toute autre valeur lue : non interprétée, avertissement. restore_mode
  # imposé à DISABLED : jamais de commande au démarrage.
  # Fins automatiques (notice KW3) : Éco au prochain passage en réduit, Party
  # au prochain passage en normal. Party chauffe aussi l'ECS et fait tourner
  # la pompe de bouclage.
  - platform: visslink
    visslink_id: viessmann
    name: "Radiateurs - Party"
    address: 0x2303
    update_interval: 60s
    icon: mdi:party-popper
    allow_write: false  # étape 2
    status:
      name: "Radiateurs - Party - État commande"

  - platform: visslink
    visslink_id: viessmann
    name: "Radiateurs - Éco"
    address: 0x2302
    update_interval: 60s
    icon: mdi:leaf
    allow_write: false  # étape 3
    status:
      name: "Radiateurs - Éco - État commande"

  - platform: visslink
    visslink_id: viessmann
    name: "Plancher chauffant - Party"
    address: 0x3303
    update_interval: 60s
    icon: mdi:party-popper
    allow_write: false  # étape 5
    status:
      name: "Plancher chauffant - Party - État commande"

  - platform: visslink
    visslink_id: viessmann
    name: "Plancher chauffant - Éco"
    address: 0x3302
    update_interval: 60s
    icon: mdi:leaf
    allow_write: false  # étape 6, en dernier : écriture documentée nulle part
    status:
      name: "Plancher chauffant - Éco - État commande"

number:
  # --- v0.9.1 : consignes Party (EXPÉRIMENTAL) ------------------------------
  # Lecture validée (°C entiers). Écriture : limites internes provisoires
  # A1 16..23 °C, M2 16..22 °C (comme la consigne confort du circuit), sans
  # lien avec les consignes confort/réduite, jamais modifiées par ces entités.
  # Étape 1 : 0x2308 seule inscriptible.
  - platform: visslink
    visslink_id: viessmann
    name: "Radiateurs - Consigne Party"
    address: 0x2308
    min_value: 16
    max_value: 23
    step: 1
    update_interval: 5min
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:party-popper
    allow_write: true   # étape 1 de la validation
    status:
      name: "Radiateurs - Consigne Party - État modification"

  - platform: visslink
    visslink_id: viessmann
    name: "Plancher - Consigne Party"
    address: 0x3308
    min_value: 16
    max_value: 22
    step: 1
    update_interval: 5min
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:party-popper
    allow_write: false  # étape 4 (M2 : Vitotrol 200, « Fernbedienung » ?)
    status:
      name: "Plancher - Consigne Party - État modification"

  - platform: visslink
    visslink_id: viessmann
    name: "Radiateurs - Consigne confort"
    address: 0x2306
    min_value: 16
    max_value: 23
    step: 1
    update_interval: 60s
    unit_of_measurement: "°C"
    mode: box
    status:
      name: "Radiateurs - Consigne confort - État modification"

  - platform: visslink
    visslink_id: viessmann
    name: "Radiateurs - Consigne réduite"
    address: 0x2307
    min_value: 10
    max_value: 20
    step: 1
    update_interval: 60s
    unit_of_measurement: "°C"
    mode: box
    status:
      name: "Radiateurs - Consigne réduite - État modification"

  - platform: visslink
    visslink_id: viessmann
    id: m2_comfort_setpoint
    name: "Plancher - Consigne confort"
    address: 0x3306
    min_value: 16
    max_value: 22
    step: 1
    update_interval: 60s
    unit_of_measurement: "°C"
    mode: box
    status:
      name: "Plancher - Consigne confort - État modification"

  - platform: visslink
    visslink_id: viessmann
    name: "Plancher - Consigne réduite"
    address: 0x3307
    min_value: 14
    max_value: 20
    step: 1
    update_interval: 60s
    unit_of_measurement: "°C"
    mode: box
    status:
      name: "Plancher - Consigne réduite - État modification"

  - platform: visslink
    visslink_id: viessmann
    name: "ECS - Consigne"
    address: 0x6300
    min_value: 40
    max_value: 60
    step: 1
    unit_of_measurement: "°C"
    mode: box

# --- Modes de fonctionnement (v0.4, expérimental) ------------------------------
# Affichés en texte. Valeurs validées sur cette KW3 : 00 = ECS seule,
# 03 = Chauffage + ECS, 05 = Arrêt ; toute autre valeur : inconnu.
# Deux sélecteurs indépendants. Leur état est toujours la dernière valeur
# RELUE, jamais une commande en attente. Écriture :
#   - A1 (0x2301) : enable_writes ET enable_mode_writes ;
#   - M2 (0x3301) : en plus enable_m2_mode_write (écriture non documentée).
# Sinon, une commande est refusée (journal) et l'entité revient à la valeur
# lue. Après chaque commande, A1 et M2 sont relus ; `divergence` signale des
# modes différents, jamais corrigés automatiquement.
select:
  - platform: visslink
    visslink_id: viessmann
    name: "Radiateurs - Mode actuel"
    address: 0x2301
    update_interval: 5min
    divergence:
      name: "Modes A1 et M2 différents"

  - platform: visslink
    visslink_id: viessmann
    id: m2_mode
    name: "Plancher chauffant - Mode actuel"
    address: 0x3301
    update_interval: 5min

# --- v0.7 : climate du circuit plancher M2 (expérimental) ----------------------
# Cible = consigne CONFORT de M2 (0x3306), pas une consigne de pièce ; ambiance
# = Vitotrol ; mode HEAT = programme 03, OFF = 00 (ECS seule, eau chaude
# toujours produite). Mêmes autorisations que les entités sources. Ne lit et
# n'écrit aucun registre lui-même.
climate:
  - platform: visslink
    visslink_id: viessmann
    name: "Plancher chauffant"
    comfort_setpoint_id: m2_comfort_setpoint
    mode_id: m2_mode
    current_temperature_id: m2_room_temperature
    pump_id: m2_pump
    # v0.7.3 : état Chauffe / Inertie / Arrêt / Inconnu (brûleur 0x0842 déjà
    # lu, aucune lecture supplémentaire) ; « heating » seulement en Chauffe.
    burner_id: bruleur_actif
    status:
      name: "Plancher chauffant - État"

# --- Bouclage ECS à la demande (v0.5, EXPÉRIMENTAL) ---------------------------
# Ajoute une plage temporaire au bloc du jour de la programmation du bouclage,
# puis rétablit exactement le bloc d'origine (sauvegardé en flash avant toute
# écriture). La pompe reste commandée par la régulation : 0x0846 n'est jamais
# écrit ; il reste lu pour voir si le circulateur tourne réellement.
# Autorisé par défaut les sept jours (validated_days, sans déclaration ; une
# liste réduite ou [] le restreint). Sauvegarde en flash, relecture et
# restauration vérifiée restent obligatoires.
visslink_boost:
  visslink_id: viessmann
  time_id: ha_time
  start:
    name: "Bouclage ECS — Démarrer maintenant"
  duration:
    name: "Bouclage ECS — Durée"
  restore:
    name: "Bouclage ECS — Restaurer la programmation"
  forget:
    name: "Bouclage ECS — Oublier la sauvegarde"
  active:
    name: "Bouclage ECS — Plage temporaire en cours"
  # Plage temporaire inscrite dans la Vitotronic ("14:00-14:30 (dimanche)",
  # ou "Aucune") : arrondie à la dizaine, souvent plus longue que la durée.
  range:
    name: "Bouclage ECS — Plage inscrite"
  # Minutes avant la restauration automatique : durée demandée exactement,
  # comptée depuis la confirmation de l'écriture. Jamais prolongée.
  remaining:
    name: "Bouclage ECS — Temps restant"
  restoring:
    name: "Bouclage ECS — Restauration en cours"
  restore_required:
    name: "Bouclage ECS — Restauration nécessaire"
  status:
    name: "Bouclage ECS — État de l'opération"

# --- Programmations horaires (lecture seule) ---------------------------------
# `address` est celle du lundi ; les 7 jours sont lus à address + 8 × jour.
# État principal : la semaine, jours identiques regroupés
#   "Lu-Ve 06:00-22:00 | Sa-Di 07:00-23:00"
# `today` : programmation du jour. `active` : une plage programmée est en cours
# (n'indique PAS que le brûleur ou une pompe fonctionne réellement).
# Option : `monday:` ... `sunday:` (un capteur texte par jour, cf. README).
text_sensor:
  - platform: visslink
    id: programmation_a1
    name: "Radiateurs - Programmation"
    address: 0x2000
    update_interval: 6h
    time_id: ha_time
    today:
      name: "Radiateurs - Programmation du jour"
    active:
      name: "Radiateurs - Plage active"

  - platform: visslink
    id: programmation_m2
    name: "Plancher - Programmation"
    address: 0x3000
    update_interval: 6h
    time_id: ha_time
    today:
      name: "Plancher - Programmation du jour"
    active:
      name: "Plancher - Plage active"

  - platform: visslink
    id: programmation_ecs
    name: "ECS - Programmation"
    address: 0x2100
    update_interval: 6h
    time_id: ha_time
    today:
      name: "ECS - Programmation du jour"
    active:
      name: "ECS - Plage active"

  - platform: visslink
    id: programmation_bouclage
    name: "Bouclage ECS - Programmation"
    address: 0x2200
    update_interval: 6h
    time_id: ha_time
    today:
      name: "Bouclage ECS - Programmation du jour"
    active:
      name: "Bouclage ECS - Plage active"

  # v0.8.1 : réseau (diagnostic, aucune lecture Optolink).
  - platform: wifi_info
    ip_address:
      name: "VissLink - Adresse IP"
    ssid:
      name: "VissLink - Réseau Wi-Fi"

  # Horloge de la Vitotronic (0x088E), lecture seule : à comparer avec
  # l'afficheur avant d'utiliser le bouclage à la demande.
  - platform: visslink
    visslink_id: viessmann
    type: vito_clock
    name: "Vitotronic - Horloge"

# --- Éditeur des programmations (v0.8, EXPÉRIMENTAL) --------------------------
# Autorisé par défaut, sans option d'autorisation. Aucune lecture périodique
# supplémentaire : il réutilise les quatre programmations ci-dessus (7 blocs
# toutes les 6 h, 30 s entre deux blocs) et lit seulement le bloc modifié,
# avant et après l'écriture. Une seule entité : l'état des opérations.
visslink_schedule_editor:
  id: programmations
  visslink_id: viessmann
  schedules:
    - programmation_a1
    - programmation_m2
    - programmation_ecs
    - programmation_bouclage
  status:
    name: "Programmations - État de l'édition"

# --- Cycles du brûleur (v0.8.1, diagnostic) ------------------------------------
# Aucune lecture Optolink : observe les lectures des entités ci-dessus.
# EXACT (compteurs de la chaudière, lus toutes les heures) : démarrages sur
# 24 h (publiés après 24 h de fonctionnement de l'ESP), démarrages par heure
# et durée moyenne (dès 1 h, sur la fenêtre disponible, au plus 24 h).
# ESTIMÉ (brûleur lu toutes les 30 s) : chaque changement d'état est daté au
# milieu de deux lectures, à ± 15 s ; un cycle plus court que 30 s peut ne
# pas être vu. Après une lecture manquée : « inconnu », jamais deviné.
visslink_burner:
  burner_id: bruleur_actif
  starts_id: demarrages_bruleur
  runtime_id: fonctionnement_bruleur
  boiler_temperature_id: temperature_chaudiere
  starts_24h:
    name: "Brûleur - Démarrages sur 24 h"
  starts_per_hour:
    name: "Brûleur - Démarrages par heure"
  average_runtime:
    name: "Brûleur - Durée moyenne de fonctionnement"
  last_cycle:
    name: "Brûleur - Durée du dernier cycle (estimation)"
  last_stop:
    name: "Brûleur - Durée du dernier arrêt (estimation)"
  start_temperature:
    name: "Brûleur - Température chaudière au démarrage (estimation)"
  stop_temperature:
    name: "Brûleur - Température chaudière à l'arrêt (estimation)"
  status:
    name: "Brûleur - Précision des cycles"
