# VissLink v0.2.2 — CONFIGURATION DE DIAGNOSTIC (temporaire, lecture seule)
# Base : examples/iot-viessmann.yaml (v0.2.1), inchangée, plus six registres
# expérimentaux lus en valeurs numériques BRUTES (entités « TEST — ... »).
#
# But : comparer ces valeurs au fonctionnement réel de l'installation avant de
# les interpréter. Procédure complète : docs/registres.md.
#
#  - Aucune valeur TEST n'est convertie en état binaire ni en température.
#  - Les octets bruts reçus restent visibles dans les journaux DEBUG :
#      [D][visslink]: 0x0846 <- 01
#    et chaque échec avec sa cause :
#      [W][visslink]: 0x0846: response timeout (attempt 1/3)
#  - Home Assistant enregistre l'historique des entités TEST : rien n'est
#    stocké sur l'ESP8266.
#
# Charge : ~10,9 lectures/min (production : ~7,2). Simulé avec une resynchro de
# 2 à 4 s (tests sim_v022_*) : brûleur à 30 s et températures à 60 s
# inchangés jusqu'à 3,5 s ; à 4 s, quelques lectures du brûleur retardées
# pendant le rafraîchissement des programmations (toutes les 6 h).
#
# STRATÉGIE RECOMMANDÉE : valider par groupes de deux, un groupe à la fois
# (commenter les quatre autres entrées TEST) ; aucun effet sur le brûleur,
# même à 4 s. Voir docs/registres.md, « Diagnostic par groupes ».
#   G1 : 0x0846, 0x0845 — ECS (bouclage, charge)
#   G2 : 0x2906, 0x3906 — circulateurs A1, M2
#   G3 : 0x0883, 0x5502 — défaut et consigne chaudière
#
# Même nom de nœud que la production : flasher ce fichier REMPLACE le firmware
# de production. Revenir ensuite à examples/iot-viessmann.yaml et supprimer
# dans Home Assistant les entités TEST devenues orphelines.

esphome:
  name: iot-viessmann
  friendly_name: Chaudière Viessmann

esp8266:
  board: d1_mini

external_components:
  # Dépôt local (développement). Pour utiliser la version publiée :
  #   - source: github://ubikyo/visslink
  #     components: [visslink]
  - source:
      type: local
      path: ../components
    components: [visslink]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "iot-viessmann Fallback"
    password: !secret fallback_ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # Chiffrement OTA avec la clé de l'API (recommandé par ESPHome 2026.10).
    encryption: {}

# L'UART matériel (GPIO1/GPIO3) est réservé à l'Optolink :
# les journaux passent uniquement par l'API / le réseau.
logger:
  level: DEBUG
  baud_rate: 0

uart:
  id: optolink_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 4800
  data_bits: 8
  parity: EVEN
  stop_bits: 2

# Heure locale fournie par Home Assistant : jour courant et plage active des
# programmations horaires. Sans synchronisation, ces états restent inconnus.
time:
  - platform: homeassistant
    id: ha_time

visslink:
  uart_id: optolink_uart
  # Valeurs par défaut, affichées pour référence :
  sync_timeout: 10s       # attente maximale du caractère de synchro 0x05
  response_timeout: 1s    # attente maximale de la réponse après la requête
  max_retries: 2          # nouvelles tentatives avant d'abandonner le cycle

sensor:
  # --- Températures (int16, dixièmes de degré) ------------------------------
  # Le type int16 est le défaut (comportement v0.1) ; il est écrit ici pour
  # la lisibilité.
  - platform: visslink
    name: "Température extérieure"
    address: 0x0800
    data_type: int16
    update_interval: 60s
    unit_of_measurement: "°C"
    device_class: temperature
    filters:
      - multiply: 0.1

  - platform: visslink
    name: "Température chaudière"
    address: 0x0802
    data_type: int16
    update_interval: 60s
    unit_of_measurement: "°C"
    device_class: temperature
    filters:
      - multiply: 0.1

  - platform: visslink
    name: "Température ECS"
    address: 0x0804
    data_type: int16
    update_interval: 60s
    unit_of_measurement: "°C"
    device_class: temperature
    filters:
      - multiply: 0.1

  - platform: visslink
    name: "Température départ M2"
    address: 0x3900
    data_type: int16
    update_interval: 60s
    unit_of_measurement: "°C"
    device_class: temperature
    filters:
      - multiply: 0.1

  # --- Consignes (uint8, degrés entiers) ------------------------------------
  - platform: visslink
    name: "Consigne A1 confort"
    address: 0x2306
    data_type: uint8
    update_interval: 5min
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 0

  - platform: visslink
    name: "Consigne A1 réduit"
    address: 0x2307
    data_type: uint8
    update_interval: 5min
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 0

  - platform: visslink
    name: "Consigne M2 confort"
    address: 0x3306
    data_type: uint8
    update_interval: 5min
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 0

  - platform: visslink
    name: "Consigne M2 réduit"
    address: 0x3307
    data_type: uint8
    update_interval: 5min
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 0

  - platform: visslink
    name: "Consigne ECS"
    address: 0x6300
    data_type: uint8
    update_interval: 5min
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 0

  # --- Brûleur (compteurs uint32) -------------------------------------------
  - platform: visslink
    name: "Démarrages brûleur"
    address: 0x088A
    data_type: uint32
    update_interval: 1h
    state_class: total_increasing
    accuracy_decimals: 0

  - platform: visslink
    name: "Heures de fonctionnement brûleur"
    address: 0x08A7
    data_type: uint32          # secondes
    update_interval: 1h
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.00027777778  # s -> h

  # === TEST — registres expérimentaux, valeurs brutes (v0.2.2) ==============
  # Aucune interprétation : la valeur publiée est l'octet (ou l'int16) reçu.
  # Une valeur non nulle ne prouve PAS qu'une pompe tourne ; une plage horaire
  # active non plus. Validation recommandée : un groupe à la fois
  # (docs/registres.md) :
  #   G1 ECS        : 0x0846, 0x0845
  #   G2 circuits   : 0x2906, 0x3906
  #   G3 chaudière  : 0x0883, 0x5502

  # G1 — Bouclage sanitaire ECS (supposé). 60 s : les plages programmées
  # peuvent ne durer que 10 min (21:40-21:50).
  - platform: visslink
    name: "TEST — Bouclage ECS brut"
    address: 0x0846
    data_type: uint8
    update_interval: 60s
    accuracy_decimals: 0
    entity_category: diagnostic

  # G1 — Pompe de charge ECS (supposée). 60 s : suivre un cycle de
  # réchauffage du ballon et l'éventuelle post-circulation.
  - platform: visslink
    name: "TEST — Charge ECS brute"
    address: 0x0845
    data_type: uint8
    update_interval: 60s
    accuracy_decimals: 0
    entity_category: diagnostic

  # G2 — Circulateur radiateurs A1 (supposé). Change lentement : 2 min.
  - platform: visslink
    name: "TEST — Circulateur A1 brut"
    address: 0x2906
    data_type: uint8
    update_interval: 2min
    accuracy_decimals: 0
    entity_category: diagnostic

  # G2 — Circulateur plancher M2 (supposé).
  - platform: visslink
    name: "TEST — Circulateur M2 brut"
    address: 0x3906
    data_type: uint8
    update_interval: 2min
    accuracy_decimals: 0
    entity_category: diagnostic

  # G3 — Défaut chaudière (supposé). Codage inconnu (indicateur, code,
  # champ de bits ?) : ne PAS provoquer de panne pour le tester.
  - platform: visslink
    name: "TEST — Défaut chaudière brut"
    address: 0x0883
    data_type: uint8
    update_interval: 5min
    accuracy_decimals: 0
    entity_category: diagnostic

  # G3 — Consigne chaudière calculée (supposée). Valeur int16 BRUTE, sans
  # facteur ni unité : le facteur 0,1 reste à confirmer contre l'affichage
  # de la régulation (journal : "0x5502 <- 4A 02" = 586 brut).
  - platform: visslink
    name: "TEST — Consigne chaudière brute"
    address: 0x5502
    data_type: int16
    update_interval: 2min
    accuracy_decimals: 0
    entity_category: diagnostic

binary_sensor:
  # 0x00 = arrêt, 0x01 = marche. Toute autre valeur : état inconnu + avertissement
  # dans les journaux (aucune interprétation arbitraire).
  - platform: visslink
    name: "Brûleur actif"
    address: 0x0842
    update_interval: 30s
    device_class: running

  # Les registres TEST ne sont PAS déclarés en binary_sensor ici : une adresse
  # ne peut être déclarée qu'une fois, et un état binaire ne sera créé
  # qu'après validation (docs/registres.md).

# --- Programmations horaires (lecture seule) ---------------------------------
# `address` est celle du lundi ; les 7 jours sont lus à address + 8 × jour.
# État principal : la semaine, jours identiques regroupés
#   "Lu-Ve 06:00-22:00 | Sa-Di 07:00-23:00"
# `today` : programmation du jour. `active` : une plage programmée est en cours
# (n'indique PAS que le brûleur ou une pompe fonctionne réellement).
# Option : `monday:` ... `sunday:` (un capteur texte par jour, cf. README).
text_sensor:
  - platform: visslink
    name: "Radiateurs - Programmation"
    address: 0x2000
    update_interval: 6h
    time_id: ha_time
    today:
      name: "Radiateurs - Programmation du jour"
    active:
      name: "Radiateurs - Plage active"

  - platform: visslink
    name: "Plancher - Programmation"
    address: 0x3000
    update_interval: 6h
    time_id: ha_time
    today:
      name: "Plancher - Programmation du jour"
    active:
      name: "Plancher - Plage active"

  - platform: visslink
    name: "ECS - Programmation"
    address: 0x2100
    update_interval: 6h
    time_id: ha_time
    today:
      name: "ECS - Programmation du jour"
    active:
      name: "ECS - Plage active"

  - platform: visslink
    name: "Bouclage ECS - Programmation"
    address: 0x2200
    update_interval: 6h
    time_id: ha_time
    today:
      name: "Bouclage ECS - Programmation du jour"
    active:
      name: "Bouclage ECS - Plage active"
